name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and sample (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install Word converter dependency
        run: python -m pip install python-docx==1.2.0
      - name: Run bundled tests
        run: python -m unittest discover -s tests -v
      - name: Verify the sample study
        run: python scripts/verify_study.py verify samples/library-room-booking/study-manifest.json samples/library-room-booking/evidence-ledger.json
